<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhattan Partition Level Editor TODO we need to add the extra attributes stuff</title>
    <link rel="stylesheet" href="editor_style.css">
</head>
<body>
    <div id="menu">
        <h1>MANHATTAN LEVEL EDITOR</h1>
        <button class="button" id="newProjectBtn">NEW PROJECT</button>
        <button class="button" id="loadProjectBtn">LOAD PROJECT</button>
    </div>

    <div id="editor">
        <canvas id="canvas"></canvas>
        
        <div id="info">
            <div>Zoom: <span id="zoomLevel">1.0</span>x</div>
            <div>Position: (<span id="mouseX">0</span>, <span id="mouseY">0</span>)</div>
            <div>Rectangles: <span id="rectCount">0</span></div>
            <div>Mode: <span id="modeText">Drawing</span></div>
        </div>
        
        <button id="saveProjectBtn" class="button top-button">SAVE PROJECT</button>
        <button id="worldBoundaryBtn" class="button top-button">DEFINE WORLD BOUNDARY</button>
        <button id="downloadBtn" class="button top-button">DOWNLOAD MAP.TXT</button>
        
        <div id="loadingBar">
            <h2>MANHATTAN PARTITIONING</h2>
            <div>Processing...</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        
        <div id="configPanel">
            <h2 id="configTitle">Configure Rectangle</h2>
            
            <h3>Floor/Ceiling Properties</h3>
            <label>Floor Height:</label>
            <input type="number" id="floorHeight" value="-2" step="0.1">
            <label>Ceiling Height:</label>
            <input type="number" id="ceilingHeight" value="2" step="0.1">
            <label>Floor Texture:</label>
            <input type="text" id="floorTexture" value="floor.png">
            <label>Floor Brightness:</label>
            <input type="number" id="floorBrightness" value="1.0" step="0.1" min="0">
            <label>Floor Tiled:</label>
            <input type="number" id="floorTiled" value="1" step="1" min="0">
            <label>Floor Skip Texture:</label>
            <input type="checkbox" id="floorSkipTexture">
            <label>Ceiling Texture:</label>
            <input type="text" id="ceilingTexture" value="ceiling.png">
            <label>Ceiling Brightness:</label>
            <input type="number" id="ceilingBrightness" value="1.0" step="0.1" min="0">
            <label>Ceiling Tiled:</label>
            <input type="number" id="ceilingTiled" value="1" step="1" min="0">
            <label>Ceiling Skip Texture:</label>
            <input type="checkbox" id="ceilingSkipTexture">
            
            <div id="wallsConfig"></div>
            
            <div class="button-group">
                <button id="saveConfig" class="button">SAVE</button>
            </div>
        </div>
    </div>
    <script src="editor.js"></script>
</body>
</html>
