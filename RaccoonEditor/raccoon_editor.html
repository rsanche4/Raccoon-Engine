<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raccoon Level Editor</title>
    <link rel="stylesheet" href="raccoon_style.css">
</head>
<body>
    <div id="menu">
        <h1>RACCOON LEVEL EDITOR</h1>
        <button id="newMapBtn">NEW MAP</button>
        <button id="loadMapBtn" disabled>LOAD MAP</button>
    </div>

    <div id="editor">
        <canvas id="canvas"></canvas>
        <div id="info">
            <div>Zoom: <span id="zoomLevel">1.0</span>x</div>
            <div>Position: (<span id="mouseX">0</span>, <span id="mouseY">0</span>)</div>
            <div>Shapes: <span id="lineCount">0</span></div>
            <div>Current Lines: <span id="currentLines">0</span></div>
        </div>
        <button id="finalizeBtn">FINALIZE MAP</button>
        <button id="saveBtn">SAVE MAP</button>
        <div id="configPanel">
            <h2>Configure Sector <span id="sectorNum"></span></h2>
            <label>Floor Height:</label>
            <input type="number" id="floorHeight" value="-2" step="0.1">
            <label>Ceiling Height:</label>
            <input type="number" id="ceilingHeight" value="2" step="0.1">
            <label>Floor Texture:</label>
            <input type="text" id="floorTexture" value="floor.png">
            <label>Floor Brightness:</label>
            <input type="number" id="floorBrightness" value="1.0" step="0.1" min="0">
            <label>Ceiling Texture:</label>
            <input type="text" id="ceilingTexture" value="ceiling.png">
            <label>Ceiling Brightness:</label>
            <input type="number" id="ceilingBrightness" value="1.0" step="0.1" min="0">
            <div id="wallsContainer"></div>
            <div class="button-group">
                <button id="saveConfig">SAVE</button>
                <button id="cancelConfig">CANCEL</button>
            </div>
        </div>
    </div>

    <script src="editor.js"></script>
</body>
</html>
